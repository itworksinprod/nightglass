<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Nightglass toolbar controls</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100vh;
        grid-template-columns: minmax(0, 1fr) 390px;
        align-items: center;
        gap: clamp(48px, 8vw, 120px);
        padding: 60px clamp(56px, 8vw, 112px);
        overflow: hidden;
        background:
          radial-gradient(circle at 13% 16%, rgba(73, 219, 214, 0.14), transparent 30rem),
          radial-gradient(circle at 88% 0%, rgba(34, 186, 218, 0.12), transparent 28rem),
          linear-gradient(135deg, #101c34, #0c2945);
        color: #f4faff;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 44px;
      }

      .brand img {
        width: 58px;
        height: 58px;
      }

      .brand strong,
      .brand span {
        display: block;
      }

      .brand strong {
        font-size: 1.15rem;
      }

      .brand span {
        margin-top: 2px;
        color: #9bb8ca;
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: #70f5ec;
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 660px;
        margin: 0;
        font-size: clamp(3rem, 5.8vw, 5.5rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      .summary {
        max-width: 600px;
        margin: 24px 0 0;
        color: #cae3ff;
        font-size: 1.12rem;
        line-height: 1.55;
      }

      iframe {
        width: 390px;
        height: 600px;
        border: 1px solid rgba(112, 245, 236, 0.28);
        border-radius: 22px;
        background: #101c34;
        box-shadow: 0 32px 90px rgba(0, 0, 0, 0.44), 0 0 0 8px rgba(73, 219, 214, 0.045);
      }

      @media (max-width: 820px) {
        body {
          grid-template-columns: 1fr;
          justify-items: center;
          padding: 30px;
        }

        .copy {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <section class="copy" aria-labelledby="preview-title">
      <div class="brand">
        <img src="../assets/icons/nightglass-64.png" alt="" width="58" height="58" aria-hidden="true">
        <div>
          <strong>Nightglass</strong>
          <span>Private dark reader</span>
        </div>
      </div>
      <p class="eyebrow">Toolbar controls</p>
      <h1 id="preview-title">Your reading setup, one click away.</h1>
      <p class="summary">Tune every website or make a local exception without an account, analytics, or cloud settings.</p>
    </section>

    <iframe
      src="../src/ui/popup.html?preview=1"
      title="Nightglass toolbar popup"
      width="390"
      height="600"
    ></iframe>
  </body>
</html>
